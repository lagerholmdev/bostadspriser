[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prislandskap"
version = "2.0.0"
description = "Datapipeline för Stockholms prislandskap: hämtar, exporterar och ritar delningsbilder."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "pillow>=11",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "shapely>=2.0", "pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
prislandskap = "prislandskap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prislandskap = ["assets/fonts/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Svenska texter innehåller tecken som ruff annars varnar för (–, −, ±).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
