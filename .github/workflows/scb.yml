name: SCB-statistik

# Hämtar SCB:s områdesstatistik (DeSO 2025) till data/scb/ en gång om året, och när någon kör den
# manuellt. Månadsjobbet i deploy.yml anropar aldrig SCB, så ett fel här stoppar ingen publicering.
on:
  schedule:
    - cron: "43 5 4 5 *" # 4 maj 05:43 UTC; SCB:s DeSO-tabeller för förra året är ute i slutet av april
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scb:
    name: Hämta, kontrollera och spara
    runs-on: ubuntu-latest
    permissions:
      contents: write # checka in data/scb/
      actions: write # starta publiceringen efteråt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: ./.github/actions/pipeline-setup
      - name: Installera geobiblioteken
        working-directory: pipeline
        run: pip install -c requirements.lock -e ".[geo]"

      - name: DeSO till område
        run: python -m prislandskap deso
      - name: Hämta från SCB
        run: python -m prislandskap scb

      # Samma kontroller som månadsjobbet, med den nya datan, innan något checkas in.
      - name: Pipelinens tester
        working-directory: pipeline
        run: pytest
      - name: Exportera data och delningsbilder
        run: python -m prislandskap all
      - uses: ./.github/actions/web-build

      - name: Spara och publicera
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/scb
          if git diff --cached --quiet; then
            echo "SCB-statistiken är oförändrad."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Uppdatera SCB-statistik $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" = main ]; then
            gh workflow run deploy.yml --ref main
          fi
