name: SCB-upptäckt (tillfällig)
on:
  push:
    branches: [scb-upptack]
    paths: [".github/upptack/**", ".github/workflows/scb-upptack.yml"]
permissions:
  contents: write
jobs:
  upptack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provkör scb-pipeline-grenen
        run: |
          git fetch origin scb-pipeline
          mkdir prov && git --work-tree=prov checkout origin/scb-pipeline -- .
          git reset -q
          cd prov/pipeline && pip install -q -c requirements.lock -e ".[dev,geo]"
          cd .. && (python -m prislandskap deso && python -m prislandskap scb) 2>&1 | tee ../prov.log || true
      - run: |
          rm -rf upptack && mkdir -p upptack && cp -r prov/data/scb upptack/ || true
          mv prov.log upptack/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upptack && git commit -m "Provkörning" && git push
