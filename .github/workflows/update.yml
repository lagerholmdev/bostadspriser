name: Uppdatera och publicera

on:
  schedule:
    - cron: "17 6 10 * *"   # den 10:e varje månad, 06:17 UTC (Mäklarstatistik publicerar runt den 8:e)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "data/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Hämta ny statistik
        if: github.event_name != 'push'
        run: python scripts/scrape.py
      - name: Bygg sidan
        run: python scripts/build_site.py
      - name: Spara ny ögonblicksbild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || (git commit -m "Uppdatera data $(date +%Y-%m)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
