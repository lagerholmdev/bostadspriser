name: Installera pipelinen
description: Python med pipelinen installerad mot de låsta versionerna i pipeline/requirements.lock.
inputs:
  python-version:
    description: Python-version
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          pipeline/requirements.lock
          pipeline/pyproject.toml
    - name: Installera prislandskap
      shell: bash
      working-directory: pipeline
      run: pip install -c requirements.lock -e ".[dev]"
